<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Frutería POS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --primary: #2d6a4f;
    --primary-light: #40916c;
    --accent: #e9c46a;
    --danger: #e63946;
    --success: #06d6a0;
    --text: #1a1a2e;
    --text-light: #6c757d;
    --border: #dee2e6;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
    color: white;
    padding: 10px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .mic-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .mic-btn:hover { background: rgba(255,255,255,0.2); }
  .mic-btn:active { transform: scale(0.92); }
  .mic-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(230,57,70,0); }
  }
  .search-box {
    flex: 1;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px;
    padding: 10px 16px;
    color: white;
    font-size: 14px;
    outline: none;
  }
  .search-box::placeholder { color: rgba(255,255,255,0.6); }
  .header-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 600;
  }
  .stat-group .icon { font-size: 18px; }
  .stat-group .value { font-variant-numeric: tabular-nums; }
  .tasa-input {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 4px 10px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    width: 90px;
    text-align: center;
    outline: none;
  }

  /* ===== MAIN LAYOUT ===== */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ===== LEFT PANEL ===== */
  .left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .filter-bar {
    padding: 10px 14px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
    overflow-x: auto;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-light);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .filter-chip:hover { border-color: var(--primary-light); color: var(--primary); }
  .filter-chip.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .products-grid {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .product-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .product-card:hover { border-color: var(--primary-light); transform: translateY(-2px); }
  .product-card:active { transform: scale(0.97); }
  .product-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #5c4a0a;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    z-index: 2;
  }
  .product-badge.hidden { display: none; }
  .product-img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%);
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    border: 3px solid #95d5b2;
  }
  .product-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }
  .product-price-usd {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
  }
  .product-price-bs {
    font-size: 13px;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* ===== RIGHT PANEL (TICKET) ===== */
  .right-panel {
    width: 340px;
    background: var(--card);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    box-shadow: -2px 0 12px rgba(0,0,0,0.04);
  }
  .ticket-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ticket-header h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .ticket-header .items-count {
    font-size: 15px;
    color: var(--text-light);
    background: var(--bg);
    padding: 4px 12px;
    border-radius: 12px;
    font-weight: 600;
  }
  .ticket-items {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }
  .ticket-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: var(--bg);
    border-radius: 12px;
    transition: background 0.15s;
  }
  .ticket-item:hover { background: #e8eaed; }
  .ticket-item .item-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    background: rgba(45,106,79,0.1);
    padding: 2px 8px;
    border-radius: 8px;
    min-width: 36px;
    text-align: center;
  }
  .ticket-item .item-info {
    flex: 1;
    min-width: 0;
  }
  .ticket-item .item-name {
    font-size: 17px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ticket-item .item-detail {
    font-size: 14px;
    color: var(--text-light);
    margin-top: 1px;
  }
  .ticket-item .item-remove {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1.5px solid var(--danger);
    background: transparent;
    color: var(--danger);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .ticket-item .item-remove:hover {
    background: var(--danger);
    color: white;
  }
  .ticket-empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-light);
  }
  .ticket-empty .empty-icon { font-size: 52px; opacity: 0.25; margin-bottom: 12px; }
  .ticket-empty p { font-size: 14px; }

  /* Ticket Footer */
  .ticket-footer {
    padding: 14px 16px;
    border-top: 2px solid var(--border);
    background: #fafafa;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 14px;
    color: var(--text-light);
  }
  .summary-row.total {
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .summary-row.total-bs {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-light);
  }
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .action-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-cancel {
    background: #fee2e2;
    color: var(--danger);
  }
  .btn-cancel:hover { background: #fecaca; }
  .btn-pay {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
    box-shadow: 0 4px 12px rgba(45,106,79,0.3);
  }
  .btn-pay:hover {
    box-shadow: 0 6px 16px rgba(45,106,79,0.4);
    transform: translateY(-1px);
  }
  .btn-pay:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ===== MODALS ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    width: 90%;
    max-width: 380px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.2);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-product {
    text-align: center;
    margin-bottom: 16px;
  }
  .modal-product .modal-icon {
    font-size: 56px;
    margin-bottom: 6px;
  }
  .modal-product .modal-name {
    font-size: 22px;
    font-weight: 800;
  }
  .modal-product .modal-price {
    font-size: 15px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .weight-display {
    background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%);
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    margin-bottom: 16px;
    border: 2px solid #95d5b2;
  }
  .weight-display .weight-label {
    font-size: 12px;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .weight-display .weight-value {
    font-size: 52px;
    font-weight: 800;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .weight-display .weight-unit {
    font-size: 20px;
    color: var(--primary-light);
    font-weight: 600;
    margin-left: 4px;
  }
  .weight-preview {
    margin-top: 8px;
    font-size: 14px;
    color: var(--primary);
    font-weight: 600;
  }
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .numpad button {
    padding: 18px;
    border: none;
    border-radius: 14px;
    background: var(--bg);
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.1s;
    color: var(--text);
  }
  .numpad button:hover { background: #e8eaed; }
  .numpad button:active {
    transform: scale(0.95);
    background: var(--primary);
    color: white;
  }
  .numpad .btn-dot { font-size: 28px; }
  .numpad .btn-clear {
    background: #fee2e2;
    color: var(--danger);
    font-size: 13px;
  }
  .numpad .btn-clear:hover { background: #fecaca; }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-actions .btn-cancel {
    background: var(--bg);
    color: var(--text);
  }
  .modal-actions .btn-cancel:hover { background: #e8eaed; }
  .modal-actions .btn-confirm {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
  }

  /* Payment Modal */
  .payment-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .payment-option {
    padding: 16px;
    border: 2px solid var(--border);
    border-radius: 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--card);
  }
  .payment-option:hover { border-color: var(--primary-light); }
  .payment-option.selected {
    border-color: var(--primary);
    background: rgba(45,106,79,0.06);
  }
  .payment-option .pay-icon { font-size: 32px; margin-bottom: 6px; }
  .payment-option .pay-label { font-size: 13px; font-weight: 700; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  /* Responsive */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .right-panel {
      width: 100%;
      height: 42%;
      border-left: none;
      border-top: 1px solid var(--border);
    }
    .products-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 8px;
    }
    .product-img { width: 56px; height: 56px; font-size: 28px; }
    .product-name { font-size: 12px; }
    .product-price-usd { font-size: 13px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    <input type="text" class="search-box" id="searchBox" placeholder="Ej: 2 manzanas / ¿quedan plátanos?" oninput="filterProducts()">
  </div>
  <div class="header-stats">
    <div class="stat-group">
      <span class="icon">🛒</span>
      <span>Items: <span class="value" id="headerItems">0</span></span>
    </div>
    <div class="stat-group">
      <span class="icon">💰</span>
      <span>Tasa $:</span>
      <input type="number" class="tasa-input" id="tasaInput" value="36.50" step="0.01" onchange="updateTasa()">
    </div>
  </div>
  <div class="header-stats" style="margin-top:6px;">
    <div class="stat-group">
      <span>Total $: <span class="value" id="headerTotalUSD">0.00</span></span>
    </div>
    <div class="stat-group">
      <span>Total Bs: <span class="value" id="headerTotalBS">0.00</span></span>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- LEFT: PRODUCTS -->
  <div class="left-panel">
    <div class="filter-bar">
      <div class="filter-chip active" onclick="setFilter('todos', this)">🍎 Todos</div>
      <div class="filter-chip" onclick="setFilter('frutas', this)">🍊 Frutas</div>
      <div class="filter-chip" onclick="setFilter('verduras', this)">🥬 Verduras</div>
      <div class="filter-chip" onclick="setFilter('ofertas', this)">🔥 Ofertas</div>
    </div>
    <div class="products-grid" id="productsGrid">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- RIGHT: TICKET -->
  <div class="right-panel">
    <div class="ticket-header">
      <h2>🧾 Ticket</h2>
      <span class="items-count" id="itemsCount">0 items</span>
    </div>
    <div class="ticket-items" id="ticketItems">
      <div class="ticket-empty">
        <div class="empty-icon">🛒</div>
        <p>Toca un producto para agregarlo</p>
      </div>
    </div>
    <div class="ticket-footer">
      <div class="summary-row">
        <span>Items</span>
        <span id="summaryItems">0</span>
      </div>
      <div class="summary-row total">
        <span>TOTAL $</span>
        <span id="summaryTotalUSD">0.00</span>
      </div>
      <div class="summary-row total-bs">
        <span>TOTAL Bs</span>
        <span id="summaryTotalBS">0.00</span>
      </div>
      <div class="action-buttons">
        <button class="action-btn btn-cancel" onclick="clearCart()">
          ❌ Cancelar
        </button>
        <button class="action-btn" style="background:#e0e7ff;color:#3730a3;" onclick="openTicketPreview()">
          👁️ Ver Ticket
        </button>
        <button class="action-btn btn-pay" id="payBtn" onclick="openPaymentModal()" disabled>
          ✅ Cobrar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- WEIGHT MODAL -->
<div class="modal-overlay" id="weightModal">
  <div class="modal">
    <div class="modal-product">
      <div class="modal-icon" id="modalIcon">🍎</div>
      <div class="modal-name" id="modalName">Manzana</div>
      <div class="modal-price" id="modalPrice">$25.00 / kg</div>
    </div>
    <div class="weight-display">
      <div class="weight-label">PESO</div>
      <div>
        <span class="weight-value" id="weightValue">0</span>
        <span class="weight-unit" id="weightUnit">kg</span>
      </div>
      <div class="weight-preview" id="weightPreview"></div>
    </div>
    <div class="numpad">
      <button onclick="appendDigit('7')">7</button>
      <button onclick="appendDigit('8')">8</button>
      <button onclick="appendDigit('9')">9</button>
      <button onclick="appendDigit('4')">4</button>
      <button onclick="appendDigit('5')">5</button>
      <button onclick="appendDigit('6')">6</button>
      <button onclick="appendDigit('1')">1</button>
      <button onclick="appendDigit('2')">2</button>
      <button onclick="appendDigit('3')">3</button>
      <button onclick="appendDigit('.')" class="btn-dot">.</button>
      <button onclick="appendDigit('0')">0</button>
      <button onclick="clearWeight()" class="btn-clear">BORRAR</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeWeightModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmWeight()">Agregar al ticket</button>
    </div>
  </div>
</div>

<!-- PAYMENT MODAL -->
<div class="modal-overlay" id="paymentModal">
  <div class="modal">
    <div class="modal-product">
      <div class="modal-icon">💰</div>
      <div class="modal-name">Confirmar Pago</div>
      <div class="modal-price" id="paymentTotalDisplay">Total: $0.00</div>
    </div>
    <div class="payment-options">
      <div class="payment-option selected" onclick="selectPayment(this, 'efectivo')">
        <div class="pay-icon">💵</div>
        <div class="pay-label">Efectivo</div>
      </div>
      <div class="payment-option" onclick="selectPayment(this, 'tarjeta')">
        <div class="pay-icon">💳</div>
        <div class="pay-label">Tarjeta</div>
      </div>
      <div class="payment-option" onclick="selectPayment(this, 'transfer')">
        <div class="pay-icon">📱</div>
        <div class="pay-label">Transferencia</div>
      </div>
      <div class="payment-option" onclick="selectPayment(this, 'qr')">
        <div class="pay-icon">📲</div>
        <div class="pay-label">QR / Yape</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePaymentModal()">Volver</button>
      <button class="btn-confirm" onclick="completePayment()">✅ Confirmar Pago</button>
    </div>
  </div>
</div>

<script>
// ========== DATA ==========
const products = [
  { id: 'A', name: 'Manzana', icon: '🍎', group: 'frutas', um: 'kg', price: 2.50 },
  { id: 'B', name: 'Plátano', icon: '🍌', group: 'frutas', um: 'kg', price: 1.80 },
  { id: 'C', name: 'Naranja', icon: '🍊', group: 'frutas', um: 'kg', price: 2.20 },
  { id: 'D', name: 'Uva', icon: '🍇', group: 'frutas', um: 'kg', price: 4.50 },
  { id: 'E', name: 'Fresa', icon: '🍓', group: 'frutas', um: 'kg', price: 5.50 },
  { id: 'F', name: 'Piña', icon: '🍍', group: 'frutas', um: 'unidad', price: 3.50 },
  { id: 'G', name: 'Sandía', icon: '🍉', group: 'frutas', um: 'kg', price: 1.20 },
  { id: 'H', name: 'Mango', icon: '🥭', group: 'frutas', um: 'kg', price: 3.00 },
  { id: 'I', name: 'Papaya', icon: '🍈', group: 'frutas', um: 'kg', price: 1.50 },
  { id: 'J', name: 'Limón', icon: '🍋', group: 'frutas', um: 'kg', price: 2.00 },
  { id: 'K', name: 'Aguacate', icon: '🥑', group: 'frutas', um: 'kg', price: 4.00 },
  { id: 'L', name: 'Melón', icon: '🍈', group: 'frutas', um: 'kg', price: 2.80 },

];

let cart = [];
let currentProduct = null;
let currentWeight = '';
let selectedPayment = 'efectivo';
let tasa = 36.50;
let currentFilter = 'todos';
let searchTerm = '';


// ========== TICKET PREVIEW ==========
function openTicketPreview() {
  if (cart.length === 0) return;

  const now = new Date();
  const fecha = now.toLocaleDateString('es-VE');
  const hora = now.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit'});
  const totalUSD = cart.reduce((sum, item) => sum + item.totalUSD, 0);
  const totalBS = totalUSD * tasa;

  let itemsHtml = cart.map((item, idx) => {
    const subBS = item.totalUSD * tasa;
    return `
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:18px;color:#1a1a2e;">
        <span style="font-weight:700;">${idx+1}. ${item.name} ${item.icon}</span>
        <span style="font-weight:800;">$${item.totalUSD.toFixed(2)}</span>
      </div>

      </div>
    `;
  }).join('');

  document.getElementById('ticketPreviewContent').innerHTML = `
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:44px;margin-bottom:8px;">🍎</div>

      <div style="font-size:15px;color:#c0392b;font-weight:700;margin-top:6px;">Tasa: Bs ${tasa.toFixed(2)} x $1</div>
    </div>
    <div style="border-top:2px dashed #555;border-bottom:2px dashed #555;padding:16px 0;margin:16px 0;">
      ${itemsHtml}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:22px;font-weight:800;color:#1a1a2e;margin-bottom:8px;">
      <span>TOTAL $</span>
      <span>$${totalUSD.toFixed(2)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:18px;color:#1a1a2e;font-weight:700;">
      <span>TOTAL Bs</span>
      <span>Bs ${totalBS.toFixed(2)}</span>
    </div>
    <div style="text-align:center;margin-top:24px;font-size:15px;color:#555;font-weight:600;">
      ¡Gracias por su compra!<br>
      ---
    </div>
  `;

  document.getElementById('ticketPreviewModal').classList.add('active');
}

function closeTicketPreview() {
  document.getElementById('ticketPreviewModal').classList.remove('active');
}

function printTicket() {
  const content = document.getElementById('ticketPreviewContent').innerHTML;
  const w = window.open('', '_blank', 'width=360,height=600');
  w.document.write(`
    <html><head><title>Ticket</title>
    <style>body{font-family:'Courier New',monospace;padding:20px;}</style>
    </head><body>${content}</body></html>
  `);
  w.document.close();
  w.print();

// ========== INIT ==========
function init() {
  renderProducts();
}

// ========== RENDER PRODUCTS ==========
function renderProducts() {
  const grid = document.getElementById('productsGrid');
  let filtered = products;

  if (currentFilter !== 'todos') {
    filtered = filtered.filter(p => p.group === currentFilter);
  }
  if (searchTerm) {
    filtered = filtered.filter(p => 
      p.name.toLowerCase().includes(searchTerm.toLowerCase())
    );
  }

  grid.innerHTML = filtered.map(p => {
    const inCart = cart.find(item => item.id === p.id);
    const qty = inCart ? inCart.qty : 0;
    return `
      <div class="product-card" onclick="selectProduct('${p.id}')">
        <div class="product-badge ${qty > 0 ? '' : 'hidden'}">${qty > 0 ? (p.um === 'kg' ? qty.toFixed(2) : Math.round(qty)) : ''}</div>
        <div class="product-img">${p.icon}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-price-usd">$${p.price.toFixed(2)}</div>
        <div class="product-price-bs">Bs: ${(p.price * tasa).toFixed(2)}</div>
      </div>
    `;
  }).join('');
}

// ========== FILTER & SEARCH ==========
function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderProducts();
}

function filterProducts() {
  searchTerm = document.getElementById('searchBox').value;
  renderProducts();
}

function updateTasa() {
  tasa = parseFloat(document.getElementById('tasaInput').value) || 36.50;
  renderProducts();
  renderCart();
}

// ========== MIC (simulated) ==========
function toggleMic() {
  const btn = document.getElementById('micBtn');
  btn.classList.toggle('listening');
  if (btn.classList.contains('listening')) {
    setTimeout(() => {
      btn.classList.remove('listening');
      document.getElementById('searchBox').value = 'manzana';
      filterProducts();
    }, 2000);
  }
}

// ========== SELECT PRODUCT ==========
function selectProduct(id) {
  currentProduct = products.find(p => p.id === id);
  currentWeight = '';
  document.getElementById('modalIcon').textContent = currentProduct.icon;
  document.getElementById('modalName').textContent = currentProduct.name;
  document.getElementById('modalPrice').textContent = `$${currentProduct.price.toFixed(2)} / ${currentProduct.um}`;
  document.getElementById('weightUnit').textContent = currentProduct.um;
  updateWeightDisplay();
  document.getElementById('weightModal').classList.add('active');
}

// ========== NUMPAD ==========
function appendDigit(digit) {
  if (digit === '.' && currentWeight.includes('.')) return;
  if (currentWeight === '' && digit === '.') { currentWeight = '0.'; }
  else if (currentWeight === '0' && digit !== '.') { currentWeight = digit; }
  else { currentWeight += digit; }
  updateWeightDisplay();
}

function clearWeight() {
  currentWeight = '';
  updateWeightDisplay();
}

function updateWeightDisplay() {
  const val = currentWeight === '' ? '0' : currentWeight;
  document.getElementById('weightValue').textContent = val;

  const qty = parseFloat(currentWeight) || 0;
  if (qty > 0 && currentProduct) {
    const totalUSD = qty * currentProduct.price;
    const totalBS = totalUSD * tasa;
    document.getElementById('weightPreview').textContent = 
      `= $${totalUSD.toFixed(2)}  •  Bs ${totalBS.toFixed(2)}`;
  } else {
    document.getElementById('weightPreview').textContent = '';
  }
}

function closeWeightModal() {
  document.getElementById('weightModal').classList.remove('active');
  currentProduct = null;
  currentWeight = '';
}

function confirmWeight() {
  const qty = parseFloat(currentWeight) || 0;
  if (qty <= 0) return;

  const existing = cart.find(item => item.id === currentProduct.id);
  if (existing) {
    existing.qty += qty;
    existing.totalUSD = existing.qty * existing.price;
  } else {
    cart.push({
      id: currentProduct.id,
      name: currentProduct.name,
      icon: currentProduct.icon,
      um: currentProduct.um,
      price: currentProduct.price,
      qty: qty,
      totalUSD: qty * currentProduct.price
    });
  }

  closeWeightModal();
  renderCart();
  renderProducts();
}

// ========== RENDER CART ==========
function renderCart() {
  const container = document.getElementById('ticketItems');
  const itemsCount = document.getElementById('itemsCount');
  const summaryItems = document.getElementById('summaryItems');
  const summaryTotalUSD = document.getElementById('summaryTotalUSD');
  const summaryTotalBS = document.getElementById('summaryTotalBS');
  const headerItems = document.getElementById('headerItems');
  const headerTotalUSD = document.getElementById('headerTotalUSD');
  const headerTotalBS = document.getElementById('headerTotalBS');
  const payBtn = document.getElementById('payBtn');

  if (cart.length === 0) {
    container.innerHTML = `
      <div class="ticket-empty">
        <div class="empty-icon">🛒</div>
        <p>Toca un producto para agregarlo</p>
      </div>
    `;
    itemsCount.textContent = '0 items';
    summaryItems.textContent = '0';
    summaryTotalUSD.textContent = '0.00';
    summaryTotalBS.textContent = '0.00';
    headerItems.textContent = '0';
    headerTotalUSD.textContent = '0.00';
    headerTotalBS.textContent = '0.00';
    payBtn.disabled = true;
    return;
  }

  const totalItems = cart.length;
  const grandTotalUSD = cart.reduce((sum, item) => sum + item.totalUSD, 0);
  const grandTotalBS = grandTotalUSD * tasa;

  container.innerHTML = cart.map((item, idx) => `
    <div class="ticket-item">
      <div class="item-num">#${idx + 1}</div>
      <div class="item-info">
        <div class="item-name">${item.name} ${item.icon}</div>
        <div class="item-detail">${item.qty.toFixed(item.um === 'unidad' ? 0 : 2)} ${item.um} × $${item.price.toFixed(2)}</div>
      </div>
      <button class="item-remove" onclick="removeItem(${idx})">×</button>
    </div>
  `).join('');

  itemsCount.textContent = `${totalItems} item${totalItems !== 1 ? 's' : ''}`;
  summaryItems.textContent = totalItems;
  summaryTotalUSD.textContent = grandTotalUSD.toFixed(2);
  summaryTotalBS.textContent = grandTotalBS.toFixed(2);
  headerItems.textContent = totalItems;
  headerTotalUSD.textContent = grandTotalUSD.toFixed(2);
  headerTotalBS.textContent = grandTotalBS.toFixed(2);
  payBtn.disabled = false;
}

function removeItem(idx) {
  cart.splice(idx, 1);
  renderCart();
  renderProducts();
}

function clearCart() {
  if (cart.length === 0) return;
  if (confirm('¿Vaciar el ticket?')) {
    cart = [];
    renderCart();
    renderProducts();
  }
}

// ========== PAYMENT ==========
function openPaymentModal() {
  if (cart.length === 0) return;
  const totalUSD = cart.reduce((sum, item) => sum + item.totalUSD, 0);
  document.getElementById('paymentTotalDisplay').textContent = `Total: $${totalUSD.toFixed(2)} / Bs ${(totalUSD * tasa).toFixed(2)}`;
  document.getElementById('paymentModal').classList.add('active');
}

function closePaymentModal() {
  document.getElementById('paymentModal').classList.remove('active');
}

function selectPayment(el, method) {
  document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
  el.classList.add('selected');
  selectedPayment = method;
}

function completePayment() {
  const totalUSD = cart.reduce((sum, item) => sum + item.totalUSD, 0);
  const methodNames = { efectivo: 'Efectivo', tarjeta: 'Tarjeta', transfer: 'Transferencia', qr: 'QR/Yape' };

  alert(`✅ Pago completado!\n\nTotal: $${totalUSD.toFixed(2)}\nMétodo: ${methodNames[selectedPayment]}\n\n¡Gracias por su compra!`);

  cart = [];
  renderCart();
  renderProducts();
  closePaymentModal();
}
